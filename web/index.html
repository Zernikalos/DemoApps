<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zernikalos Web Demos</title>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f17;
        color: #e6e9f2;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      }

      header {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.02);
      }

      .hint {
        font-size: 12px;
        opacity: 0.75;
        margin-left: auto;
      }

      main {
        padding: 16px;
      }

      .card {
        max-width: 860px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 16px;
      }

      ul {
        margin: 10px 0 0 18px;
        padding: 0;
        line-height: 1.7;
      }

      a {
        color: #9cc2ff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Zernikalos</strong>
      <div class="hint">Assets: <code>/zko/...</code> · SDK: <code>/sdk/zernikalos.js</code></div>
    </header>

    <main>
      <div class="card">
        <h2>Web demos</h2>
        <p>
          Each demo is a standalone HTML file intended for documentation and copy/paste usage.
        </p>
        <ul>
          <li><a href="/examples/fox.html">Fox</a></li>
          <li><a href="/examples/soldier.html">Soldier</a></li>
          <li><a href="/examples/stormtrooper.html">Stormtrooper</a></li>
        </ul>
      </div>
    </main>
  </body>
</html>
